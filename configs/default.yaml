# Prespecified formal candidate; finalize using internal validation only.
schema_version: 2
status: formal_candidate
model:
  embedding_dim: 256
  concatenated_dim: 512
  classifier_hidden_dim: 256
  classifier_dropout: 0.2
  num_classes: 2
  output: raw_logit
MRI:
  backbone: resnet18
  weights: IMAGENET1K_V1
  pretrained: true
  shared_encoder: true
  roi_embedding_dim: 256
  patient_embedding_dim: 256
  fusion_hidden_dim: 512
  fusion_dropout: 0.2
  freeze_bn_running_stats: true
  train_bn_affine: true
  preserve_native_dimensions: true
  preprocessing_version: native_roi_zscore_ring_v1
  peritumoral_radius_mm: 4.0
WSI:
  backbone: resnet18
  weights: IMAGENET1K_V1
  pretrained: true
  feature_mode: offline_fixed
  node_feature_dim: 512
  patient_embedding_dim: 256
  gat_layers: 2
  gat_heads: 2
  gat1_dim: 64
  gat2_dim: 32
  gat_dropout: 0.1
  pooling: global_mean
  preprocessing:
    version: roi_hsv_native_v1
    patch_size: 448
    stride: 448
    model_size: 224  # Existing whole-field WSI resize; MRI is never resized.
    roi_coverage_threshold: 0.70
    background_saturation_threshold: 0.05
    background_value_threshold: 0.80
    background_fraction_max: 0.90
    legacy_rgb_blank_fraction_max: 0.90
    legacy_rgb_threshold: 220
    imagenet_mean: [0.485, 0.456, 0.406]
    imagenet_std: [0.229, 0.224, 0.225]
graph:
  k: 8
  max_distance: null
  bidirectional: true
objective:
  classification: BCEWithLogitsLoss
  # Smoother intra/specific learning, sharper cross/shared alignment; not optimized.
  tau_intra: 0.10
  tau_cross: 0.07
  tau_hybrid: 0.07
  tau_specific: 0.10
  lambda_cls: 1.0
  lambda_intra: 0.20
  lambda_cross: 0.30
  lambda_hybrid: 0.30
  lambda_specific: 0.20
optimizer:
  name: adamw
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-3
  bias_weight_decay: 0.0
  batchnorm_weight_decay: 0.0
  proxy_weight_decay: 0.0
  # GAT attention vectors use the regular decay group along with Conv/Linear weights.
  lr_mri_pretrained: 1.0e-5
  lr_mri_new: 1.0e-4
  lr_wsi: 1.0e-4
  lr_classifier: 1.0e-4
  lr_proxy: 5.0e-5
training:
  batch_size: 8
  max_epochs: 100
scheduler:
  name: plateau
  monitor: total
  source: internal_validation
  mode: min
  factor: 0.5
  patience: 5
  threshold: 1.0e-4
  threshold_mode: abs
  cooldown: 0
  min_lr: 1.0e-7
  eps: 1.0e-8
early_stopping:
  monitor: validation_auroc
  mode: max
  patience: 15
  min_delta: 0.001
reproducibility:
  primary_seed: 601
  robustness_seeds: [602, 603, 604, 605]
  deterministic_algorithms: false
evaluation:
  selection_metric: validation_auroc
  selection_mode: max
  score_convention: raw_logit
  tie_policy: first_occurrence_wins
  external_test_allowed: false
  threshold_optimization_allowed: false
data:
  manifest: /path/to/patient_manifest.csv
